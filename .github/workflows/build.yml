name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Set up Android SDK
        run: |
          cd /usr/local/lib
          sudo mkdir -p android-sdk/cmdline-tools
          cd android-sdk/cmdline-tools
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q commandlinetools-linux-11076708_latest.zip
          sudo rm commandlinetools-linux-11076708_latest.zip
          echo "ANDROID_HOME=/usr/local/lib/android-sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: |
          # 在上级目录创建全新的 Gradle 项目
          cd /home/runner/work/EnglishTapReader
          mkdir -p build_project
          cd build_project
          
          # 用 gradle init 创建标准 Android 项目结构
          gradle init --type basic --dsl groovy --project-name EnglishTapReader
          
          # 复制我们写好的代码进去
          cp -r /home/runner/work/EnglishTapReader/EnglishTapReader/app .
          cp /home/runner/work/EnglishTapReader/EnglishTapReader/build.gradle .
          cp /home/runner/work/EnglishTapReader/EnglishTapReader/settings.gradle .
          cp /home/runner/work/EnglishTapReader/EnglishTapReader/gradle.properties .
          
          # 确保 gradlew 可执行
          chmod +x gradlew || true
          
          # 查看文件结构
          echo "====== 当前目录文件 ======"
          ls -la
          echo "====== settings.gradle 内容 ======"
          cat settings.gradle
          
          # 开始编译
          ./gradlew assembleDebug
          
          # 把生成的 APK 复制回原来的位置
          cp app/build/outputs/apk/debug/app-debug.apk /home/runner/work/EnglishTapReader/EnglishTapReader/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug.apk
